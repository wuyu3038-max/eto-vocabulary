<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETO单词</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:15px -apple-system,PingFang SC,sans-serif;background:#f5f0e8;color:#2c2416;padding:16px}
.stats{display:flex;gap:8px;margin:10px 0}
.stats div{flex:1;background:#fff;border-radius:10px;padding:12px 8px;text-align:center}
.stats .n{font-size:22px;font-weight:700;color:#e65c00}
.btn{display:inline-block;padding:8px 14px;margin:4px;background:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer}
.card{background:#fff;border-radius:14px;padding:20px;margin:10px 0;text-align:center}
.card .en{font-size:22px;font-weight:700;color:#e65c00;margin:8px 0}
.card .zh{font-size:16px;margin:6px 0}
.card .ex{font-size:13px;color:#8c8273;margin:6px 0;line-height:1.5}
.act{display:flex;gap:6px;margin-top:12px}
.act button{flex:1;padding:12px 6px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.f{background:#ffebee;color:#c62828}.h{background:#fff3e0;color:#e65c00}.g{background:#e8f5e9;color:#2e7d32}.e{background:#e3f2fd;color:#1565c0}
.speak{display:inline-block;padding:8px 16px;background:#e65c00;color:#fff;border-radius:16px;margin:8px 0;cursor:pointer;font-size:13px}
.bar{height:3px;background:#eee;margin:8px 0;border-radius:2px}
.bar .fill{height:100%;background:#e65c00;border-radius:2px}
.done{text-align:center;padding:40px 16px}
.done button{padding:10px 24px;background:#e65c00;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Core 150 ETO + ME words
var W=[];
function a(e,z,c,x){W.push({en:e,zh:z,cat:c,ex:x||""});}

a("Multimeter","万用表","工具仪表","Measure voltage AC 750V range.");

a("Harmonics","谐波","日常工作","THD exceeds 5 percent.");
a("Overload Relay","过载继电器","电气保护","Thermal overload relay tripped.");
a("Short Circuit","短路","电气保护","MCCB instantaneous trip.");
a("Arc Flash","电弧闪光","电气保护","PPE category 3 minimum.");
a("IP Rating","防护等级","电气保护","Motor IP56 for deck exposure.");
a("Induction Motor","感应电机","电机驱动","Squirrel cage most common.");
a("Synchronous Motor","同步电机","电机驱动","For shaft generator drive.");
a("Winding","绕组","电机驱动","Insulation class F max 155C.");
a("Synchronization","并车","发电配电","Match voltage frequency phase.");
a("AVR","自动调压器","发电配电","AVR malfunction, voltage unstable.");
a("Load Sharing","负荷分配","发电配电","Adjust governor droop setting.");
a("Two-stroke Engine","二冲程柴油机","轮机主机","Slow speed direct coupled.");
a("Cylinder Liner","气缸套","轮机主机","Wear measured at 6 positions.");
a("Crosshead","十字头","轮机主机","Bearing clearance checked.");
a("Thrust Bearing","推力轴承","轮机主机","Pad temperature max 70C.");
a("Scavenge Fire","扫气箱着火","轮机主机","Reduce speed, increase lube.");
a("Turning Gear","盘车机","轮机主机","Turn one revolution before start.");

a("Oil Mist Detector","油雾探测器","轮机滑油","Check crankcase immediately.");

a("Burner","燃烧器","轮机锅炉","Nozzle cleaned, flame normal.");
a("Flame Eye","火焰探测器","轮机锅炉","UV cell sensitivity check.");
a("Feed Water Pump","给水泵","轮机锅炉","Multi-stage centrifugal.");
a("Gauge Glass","水位计","轮机锅炉","Blowdown, check clear.");
a("Safety Valve","安全阀","轮机锅炉","Pop test annually at 7.5 bar.");
a("Blowdown","下排污","轮机锅炉","Control TDS twice daily.");
a("Soot Blow","吹灰","轮机锅炉","Every 4 hours on HFO.");
a("Gear Pump","齿轮泵","轮机泵类","LO service constant flow.");
a("Screw Pump","螺杆泵","轮机泵类","FO transfer low pulsation.");
a("Cavitation","气蚀","轮机泵类","Check suction strainer.");
a("Mechanical Seal","机械密封","轮机泵类","Replace seal faces.");
a("Gland Packing","填料","轮机泵类","Slight leakage for lubrication.");
a("Gate Valve","闸阀","轮机阀门","Back seat to protect packing.");
a("Non-return Valve","止回阀","轮机阀门","Flap or spring loaded.");
a("QCV","速闭阀","轮机阀门","Close within 3 seconds.");
a("Kingston Valve","通海阀","轮机阀门","Sea suction for engine room.");
a("FPP","定距桨","轮机推进","Pitch fixed, RPM control.");
a("CPP","调距桨","轮机推进","Pitch control hydraulic system.");
a("Stern Tube","尾轴管","轮机推进","Bearing oil pressure 2 bar.");
a("Ram Type","柱塞式舵机","轮机舵机","2 or 4 ram arrangement.");
a("Bell Book","车钟记录簿","轮机值班","Bridge order entries.");
a("Noon Report","中午报告","轮机值班","Position speed consumption.");
a("Slip","滑失率","轮机值班","Engine vs observed miles.");
a("Hour Meter","运行小时表","轮机值班","PMS job scheduling.");
a("Dry Dock","干船坞","轮机坞修","Major repairs 2 weeks.");
a("Sea Trial","试航","轮机坞修","Full load test after dock.");
a("Hot Work","热工作业","轮机车间","Permit required for welding.");
a("Flange","法兰","轮机管系","Gasket torque cross pattern.");
a("Hydrostatic Test","水压试验","轮机管系","1.5x design pressure.");
a("Pressure Gauge","压力表","轮机测量","Snubber dampens pulsation.");
a("Salinometer","盐度计","轮机测量","FWG output check.");

// ===== Spaced Repetition Engine =====
var K="eto_v5",S=JSON.parse(localStorage.getItem(K)||"{}"),R=JSON.parse(localStorage.getItem(K+"_r")||"{}");
var IV=[1,10,60,360,1440,4320,10080,43200];
function save(){localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+"_r",JSON.stringify(R));}
function sched(en,q){var lv=Math.max(0,Math.min(7,(S[en]||0)+q));S[en]=lv;if(lv<=0)delete R[en];else R[en]=Date.now()+IV[Math.min(lv,7)]*60000;save();}
function due(){var n=Date.now();return W.filter(function(w){return R[w.en]&&R[w.en]<=n}).sort(function(a,b){return R[a.en]-R[b.en]});}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.85;speechSynthesis.speak(u);}

var q=[],i=0,rv=false,daily=parseInt(localStorage.getItem("eto_goal")||"20");
var td=new Date().toDateString();
var today=JSON.parse(localStorage.getItem("eto_today")||'{"d":"","c":0}');
if(today.d!==td){today={d:td,c:0};localStorage.setItem("eto_today",JSON.stringify(today));}

function home(){
  var done=Object.values(S).filter(function(v){return v>=5}).length;
  var lrn=Object.values(S).filter(function(v){return v>=1&&v<5}).length;
  var d=due().length;
  var cats={};W.forEach(function(w){cats[w.cat]=(cats[w.cat]||0)+1;});
  var etoCats=[],meCats=[];
  for(var c in cats){if(c.indexOf("轮机")>=0)meCats.push(c);else etoCats.push(c);}
  etoCats.sort();meCats.sort();
  var etoN=0,meN=0;etoCats.forEach(function(c){etoN+=cats[c];});meCats.forEach(function(c){meN+=cats[c];});

  var h="";
  h+="<div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><b style=\"font-size:18px\">ETO</b><span style=\"font-size:12px;color:#8c8273\">"+today.c+"/"+daily+"</span></div>";
  h+="<div class=\"stats\"><div><div class=\"n\">"+done+"</div><div style=\"font-size:10px;color:#8c8273\">已掌握</div></div><div><div class=\"n\">"+lrn+"</div><div style=\"font-size:10px;color:#8c8273\">学习中</div></div><div><div class=\"n\">"+d+"</div><div style=\"font-size:10px;color:#8c8273\">待复习</div></div></div>";
  h+="<button onclick=\"startReview()\" style=\"width:100%;padding:12px;background:#e65c00;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px\">"+(d>0?"复习 "+d+" 词":"开始学习")+"</button>";
  h+="<div style=\"display:flex;gap:8px;margin-bottom:8px\"><div style=\"flex:1;background:#fff;border-radius:10px;padding:10px;border-left:3px solid #e65c00\"><div style=\"font-size:11px;color:#8c8273\">ETO</div><div style=\"font-size:16px;font-weight:700;color:#e65c00\">"+etoN+"词</div></div><div style=\"flex:1;background:#fff;border-radius:10px;padding:10px;border-left:3px solid #1565c0\"><div style=\"font-size:11px;color:#8c8273\">轮机</div><div style=\"font-size:16px;font-weight:700;color:#1565c0\">"+meN+"词</div></div></div>";

  h+="<h2>ETO</h2>";
  etoCats.forEach(function(c){h+="<button class=\"btn\" onclick=\"pick('"+c.replace(/'/g,"\\'")+"')\">"+c+" <small style=\"color:#8c8273\">"+cats[c]+"</small></button>";});
  h+="<h2>轮机</h2>";
  meCats.forEach(function(c){h+="<button class=\"btn\" onclick=\"pick('"+c.replace(/'/g,"\\'")+"')\">"+c+" <small style=\"color:#8c8273\">"+cats[c]+"</small></button>";});

  document.getElementById("app").innerHTML=h;
}

function pick(c){
  var pool=W.filter(function(w){return w.cat===c});
  if(!pool.length){home();return;}
  var d=due().filter(function(w){return w.cat===c}).slice(0,5);
  var n=pool.filter(function(w){return !S[w.en]}).sort(function(){return Math.random()-0.5}).slice(0,5);
  q=d.concat(n).filter(function(v,i,a){return a.findIndex(function(x){return x.en===v.en})===i});
  if(!q.length)q=pool.sort(function(){return Math.random()-0.5}).slice(0,8);
  i=0;rv=false;learn();
}

function startReview(){var d=due();if(!d.length){home();return;}q=d.slice(0,10);i=0;rv=false;learn();}

function learn(){
  if(i>=q.length){
    today.c+=q.length;localStorage.setItem("eto_today",JSON.stringify(today));
    document.getElementById("app").innerHTML="<div class=\"done\"><div style=\"font-size:48px\">OK</div><div style=\"font-size:16px;margin:8px 0\">完成了 "+q.length+" 词</div><button onclick=\"home()\">返回</button></div>";
    return;
  }
  var w=q[i];var pct=Math.round(i/q.length*100);
  document.getElementById("app").innerHTML=
    "<div class=\"bar\"><div class=\"fill\" style=\"width:"+pct+"%\"></div></div>"+
    "<div style=\"font-size:11px;color:#8c8273;text-align:center;margin:4px 0\">"+(i+1)+"/"+q.length+" · "+w.cat+"</div>"+
    "<div class=\"card\">"+
      "<div class=\"ex\">"+w.ex+"</div>"+
      "<div onclick=\"reveal()\" style=\"cursor:pointer\" id=\"rv\">"+
        "<div class=\"en\" style=\""+(rv?"":"filter:blur(6px)")+"\">"+w.en+"</div>"+
        "<div style=\"font-size:13px;color:#8c8273;margin:4px 0\">"+(rv?w.zh:"点此查看释义")+"</div>"+
      "</div>"+
      (rv?"<div class=\"speak\" onclick=\"speak('"+w.en.replace(/'/g,"\\'")+"')\">朗读</div>":"")+
    "</div>"+
    "<div class=\"act\" style=\""+(rv?"":"display:none")+"\">"+
      "<button class=\"f\" onclick=\"rate(-1)\">不认识</button>"+
      "<button class=\"h\" onclick=\"rate(1)\">模糊</button>"+
      "<button class=\"g\" onclick=\"rate(2)\">认识</button>"+
      "<button class=\"e\" onclick=\"rate(3)\">简单</button>"+
    "</div>";
}

function reveal(){rv=true;var w=q[i];document.getElementById("rv").innerHTML="<div class=\"en\">"+w.en+"</div><div class=\"zh\">"+w.zh+"</div><div style=\"font-size:12px;color:#8c8273;margin-top:4px\">"+w.ex+"</div>";document.querySelector(".act").style.display="flex";speak(w.en);}

function rate(v){sched(q[i].en,v);i++;rv=false;learn();}

home();
</script>
</body>
</html>
