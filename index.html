var K="eto_v6",S=JSON.parse(localStorage.getItem(K)||"{}"),R=JSON.parse(localStorage.getItem(K+"_r")||"{}");
var IV=[1,10,60,360,1440,4320,10080,43200];
function save(){localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+"_r",JSON.stringify(R));}
function sched(en,q){var lv=Math.max(0,Math.min(7,(S[en]||0)+q));S[en]=lv;if(lv<=0)delete R[en];else R[en]=Date.now()+IV[Math.min(lv,7)]*60000;save();}
function due(){var n=Date.now();return W.filter(function(w){return R[w.en]&&R[w.en]<=n}).sort(function(a,b){return R[a.en]-R[b.en]});}
var _hasVoice=false;
function checkVoice(){
  if(!window.speechSynthesis)return false;
  var voices=speechSynthesis.getVoices();
  for(var j=0;j<voices.length;j++){if(voices[j].lang.indexOf("en")===0){_hasVoice=true;return true;}}
  return false;
}
speechSynthesis.onvoiceschanged=function(){checkVoice();};
function speak(){
  if(!window.speechSynthesis||!_hasVoice){
    var b=document.getElementById("spkBtn");if(b)b.innerHTML="no voice - install Google TTS";
    return;
  }
  var w=q[i];if(!w)return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(w.en);
  u.lang="en-US";u.rate=0.85;u.volume=1;
  var voices=speechSynthesis.getVoices();
  for(var j=0;j<voices.length;j++){
    if(voices[j].lang.indexOf("en")===0&&voices[j].localService){u.voice=voices[j];break;}
  }
  speechSynthesis.speak(u);
}

var q=[],i=0,rv=false,daily=parseInt(localStorage.getItem("eto_goal")||"20");
var td=new Date().toDateString();
var today=JSON.parse(localStorage.getItem("eto_today")||'{"d":"","c":0}');
if(today.d!==td){today={d:td,c:0};localStorage.setItem("eto_today",JSON.stringify(today));}

function home(){
  var done=Object.values(S).filter(function(v){return v>=5}).length;
  var lrn=Object.values(S).filter(function(v){return v>=1&&v<5}).length;
  var d=due().length;
  var cats={};W.forEach(function(w){cats[w.cat]=(cats[w.cat]||0)+1;});
  var etoCats=[],meCats=[];
  for(var c in cats){if(c.indexOf("轮机")>=0)meCats.push(c);else etoCats.push(c);}
  etoCats.sort();meCats.sort();
  var etoN=0,meN=0;etoCats.forEach(function(c){etoN+=cats[c];});meCats.forEach(function(c){meN+=cats[c];});

  var h="";
  h+="<div style=\"display:flex;justify-content:space-between;margin-bottom:8px\"><b style=\"font-size:18px\">ETO</b><span style=\"font-size:12px;color:#8c8273\" onclick=\"var g=prompt('daily goal:',daily);if(g&&parseInt(g)>0){daily=parseInt(g);localStorage.setItem('eto_goal',String(daily));home();}\">"+today.c+"/"+daily+"</span></div>";
  h+="<div class=\"stats\"><div><div class=\"n\">"+done+"</div><div style=\"font-size:10px;color:#8c8273\">已掌握</div></div><div><div class=\"n\">"+lrn+"</div><div style=\"font-size:10px;color:#8c8273\">学习中</div></div><div><div class=\"n\">"+d+"</div><div style=\"font-size:10px;color:#8c8273\">待复习</div></div></div>";
  h+="<button onclick=\"startReview()\" style=\"width:100%;padding:12px;background:#e65c00;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px\">"+(d>0?"复习 "+d+" 词":"开始学习")+"</button>";
  h+="<div style=\"display:flex;gap:8px;margin-bottom:8px\"><div style=\"flex:1;background:#fff;border-radius:10px;padding:10px;border-left:3px solid #e65c00\"><div style=\"font-size:11px;color:#8c8273\">ETO</div><div style=\"font-size:16px;font-weight:700;color:#e65c00\">"+etoN+"词</div></div><div style=\"flex:1;background:#fff;border-radius:10px;padding:10px;border-left:3px solid #1565c0\"><div style=\"font-size:11px;color:#8c8273\">轮机</div><div style=\"font-size:16px;font-weight:700;color:#1565c0\">"+meN+"词</div></div></div>";

  h+="<h2>ETO</h2>";
  etoCats.forEach(function(c){h+="<button class=\"btn\" onclick=\"pick('"+c.replace(/'/g,"\\'")+"')\">"+c+" <small style=\"color:#8c8273\">"+cats[c]+"</small></button>";});
  h+="<h2>轮机</h2>";
  meCats.forEach(function(c){h+="<button class=\"btn\" onclick=\"pick('"+c.replace(/'/g,"\\'")+"')\">"+c+" <small style=\"color:#8c8273\">"+cats[c]+"</small></button>";});

  document.getElementById("app").innerHTML=h;
}

function pick(c){
  var pool=W.filter(function(w){return w.cat===c});
  if(!pool.length){home();return;}
  var d=due().filter(function(w){return w.cat===c}).slice(0,5);
  var n=pool.filter(function(w){return !S[w.en]}).sort(function(){return Math.random()-0.5}).slice(0,5);
  q=d.concat(n).filter(function(v,i,a){return a.findIndex(function(x){return x.en===v.en})===i});
  if(!q.length)q=pool.sort(function(){return Math.random()-0.5}).slice(0,8);
  i=0;rv=false;learn();
}

function startReview(){var d=due();if(!d.length){home();return;}q=d.slice(0,10);i=0;rv=false;learn();}

function learn(){
  if(i>=q.length){
    today.c+=q.length;localStorage.setItem("eto_today",JSON.stringify(today));
    document.getElementById("app").innerHTML="<div class=\"done\"><div style=\"font-size:48px\">OK</div><div style=\"font-size:16px;margin:8px 0\">完成了 "+q.length+" 词</div><button onclick=\"home()\">返回</button></div>";
    return;
  }
  var w=q[i];var pct=Math.round(i/q.length*100);
  document.getElementById("app").innerHTML=
    "<div class=\"bar\"><div class=\"fill\" style=\"width:"+pct+"%\"></div></div>"+
    "<div style=\"font-size:11px;color:#8c8273;text-align:center;margin:4px 0\">"+(i+1)+"/"+q.length+" · "+w.cat+"</div>"+
    "<div class=\"card\">"+
      "<div class=\"ex\">"+w.ex+"</div>"+
      "<div onclick=\"reveal()\" style=\"cursor:pointer\" id=\"rv\">"+
        "<div class=\"en\" style=\""+(rv?"":"filter:blur(6px)")+"\">"+w.en+"</div>"+
        "<div style=\"font-size:13px;color:#8c8273;margin:4px 0\">"+(rv?w.zh:"点击查看释义")+"</div>"+
      "</div>"+
      (rv?"<div class=\"speak\" id=\"spkBtn\" onclick=\"speak()\">朗读</div>":"")+
    "</div>"+
    "<div class=\"act\" style=\""+(rv?"":"display:none")+"\">"+
      "<button class=\"f\" onclick=\"rate(-1)\">不认识</button>"+
      "<button class=\"h\" onclick=\"rate(1)\">模糊</button>"+
      "<button class=\"g\" onclick=\"rate(2)\">认识</button>"+
      "<button class=\"e\" onclick=\"rate(3)\">简单</button>"+
    "</div>";
}

function reveal(){rv=true;var w=q[i];document.getElementById("rv").innerHTML="<div class=\"en\">"+w.en+"</div><div class=\"zh\">"+w.zh+"</div><div style=\"font-size:12px;color:#8c8273;margin-top:4px\">"+w.ex+"</div><div class=\"speak\" id=\"spkBtn\" onclick=\"speak()\">朗读</div>";document.querySelector(".act").style.display="flex";setTimeout(function(){if(_hasVoice)speak();},100);}

function rate(v){sched(q[i].en,v);i++;rv=false;learn();}

home();
</script>
